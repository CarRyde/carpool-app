<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#D6F03C">
<title>CarRyde Classroom Display</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --vest: #D6F03C;
    --ink: #1C2128;
    --concrete: #EDEFEA;
    --white: #FFFFFF;
    --stripe: #C3CAA0;
    --line: #CDD2CA;
    --muted: #4F5861;
    --go: #17803D;
    --stop: #C62828;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --display: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
    --text: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--concrete); -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--text);
    color: var(--ink);
    background: var(--concrete);
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }
  button, input { font-family: inherit; }

  .screen { height: 100%; display: flex; flex-direction: column; }
  [hidden] { display: none !important; }

  /* ---------- Header ---------- */
  header {
    position: relative;
    background: var(--vest);
    padding: 1.3vw 3vw 1.7vw;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
  }
  header::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 0.5vw; min-height: 6px;
    background: linear-gradient(to bottom, var(--stripe) 0 33%, transparent 33% 66%, var(--stripe) 66% 100%);
  }
  .brand { font-family: var(--display); font-weight: 700; font-size: clamp(26px, 2.2vw, 48px); line-height: 1; }
  .room {
    font-family: var(--display); font-weight: 700;
    font-size: clamp(26px, 2.2vw, 48px);
    background: var(--ink); color: var(--vest);
    padding: 0.2vw 1.2vw 0.3vw; border-radius: 0.6vw; line-height: 1.1;
  }
  .right { justify-self: end; display: flex; align-items: center; gap: 1.6vw; }
  .clock { font-weight: 600; font-size: clamp(22px, 1.8vw, 40px); font-variant-numeric: tabular-nums; }
  .live {
    display: inline-flex; align-items: center; gap: 0.6vw;
    font-weight: 600; font-size: clamp(16px, 1.15vw, 26px);
  }
  .live .dot { width: 0.8vw; height: 0.8vw; min-width: 10px; min-height: 10px; border-radius: 50%; background: var(--go); }
  .live.off { color: var(--stop); }
  .live.off .dot { background: var(--stop); }

  /* ---------- Board ---------- */
  main { flex: 1; min-height: 0; overflow-y: auto; padding: 2.4vw 3vw 1vw; }
  h2.section {
    font-family: var(--display); font-weight: 700;
    font-size: clamp(26px, 2.1vw, 46px); line-height: 1;
    margin: 0 0 1.4vw;
  }
  h2.section.quiet { color: var(--muted); font-size: clamp(20px, 1.5vw, 32px); margin-top: 3vw; }
  .empty { margin: 0; color: var(--muted); font-size: clamp(18px, 1.3vw, 28px); }

  .cards { display: flex; flex-wrap: wrap; gap: 1.4vw; }
  .card {
    background: var(--vest);
    border-radius: 1vw;
    overflow: hidden;
    min-width: 15vw;
    max-width: 30vw;
    box-shadow: 0 0.3vw 0.9vw rgba(28,33,40,0.18), inset 0 0 0 0.18vw var(--ink);
  }
  .card .who { padding: 1vw 1.4vw 1.1vw; }
  .card .name {
    font-family: var(--display); font-weight: 700;
    font-size: clamp(28px, 2.5vw, 56px); line-height: 1;
    overflow-wrap: anywhere;
  }
  .card .family { margin-top: 0.35vw; font-weight: 600; font-size: clamp(16px, 1.15vw, 26px); color: var(--ink); opacity: 0.8; }
  .card .car {
    background: var(--white);
    padding: 0.8vw 1.4vw 0.9vw;
    font-weight: 600;
    font-size: clamp(18px, 1.35vw, 30px);
    line-height: 1.2;
    border-top: 0.18vw solid var(--ink);
    overflow-wrap: anywhere;
  }
  .enter { animation: rise 260ms var(--ease-out) both; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px) scale(0.98); }
    to { opacity: 1; transform: none; }
  }

  .chips { display: flex; flex-wrap: wrap; gap: 0.7vw; }
  .chip {
    display: inline-flex; align-items: center; gap: 0.5vw;
    padding: 0.35vw 1.1vw 0.4vw;
    border: 2px solid var(--line);
    border-radius: 999px;
    background: var(--white);
    font-weight: 600; font-size: clamp(16px, 1.2vw, 26px);
    color: var(--muted);
  }
  .chip .tick { color: var(--go); font-weight: 700; }

  footer { padding: 0.6vw 3vw 0.9vw; text-align: right; }
  .link-btn {
    background: none; border: none; padding: 8px 4px;
    color: var(--muted); font-size: clamp(14px, 1vw, 20px); font-weight: 600;
    text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
  }

  /* ---------- Room setup ---------- */
  .setup { height: 100%; display: grid; place-content: center; justify-items: center; gap: 18px; padding: 24px; text-align: center; }
  .setup h1 { font-family: var(--display); font-weight: 700; font-size: 48px; margin: 0; line-height: 1; }
  .setup p { margin: 0; color: var(--muted); font-size: 20px; }
  .setup input {
    width: min(320px, 80vw); height: 64px; text-align: center;
    font-size: 28px; font-weight: 600;
    border: 3px solid var(--ink); border-radius: 14px; background: var(--white); color: var(--ink);
  }
  .setup button {
    height: 64px; padding: 0 40px; border: none; border-radius: 14px;
    background: var(--vest); color: var(--ink); box-shadow: inset 0 0 0 3px var(--ink);
    font-family: var(--display); font-weight: 700; font-size: 32px; cursor: pointer;
  }
  .setup .err { color: var(--stop); font-weight: 600; }
  .setup input:focus-visible, .setup button:focus-visible, .link-btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) { .enter { animation: none; } }
</style>
</head>
<body>

<div class="setup" id="setup" hidden>
  <h1>Which room is this TV in?</h1>
  <p>You only need to do this once on this screen.</p>
  <input id="setupRoom" placeholder="108" maxlength="12" autocomplete="off" autocapitalize="characters" aria-label="Room number">
  <div class="err" id="setupErr" role="alert" hidden></div>
  <button id="setupSave" type="button">Show my room</button>
</div>

<div class="screen" id="display" hidden>
  <header>
    <div class="brand">CarRyde</div>
    <div class="room" id="roomLabel"></div>
    <div class="right">
      <div class="live" id="live" role="status"><span class="dot"></span><span id="liveText">Live</span></div>
      <div class="clock" id="clock"></div>
    </div>
  </header>
  <main>
    <h2 class="section">Waiting outside. Send them out.</h2>
    <div class="cards" id="cards"></div>
    <p class="empty" id="emptyWaiting">No one is waiting right now.</p>
    <h2 class="section quiet">Already picked up today</h2>
    <div class="chips" id="chips"></div>
    <p class="empty" id="emptyPicked">No one picked up yet.</p>
  </main>
  <footer><button class="link-btn" id="changeRoom" type="button">Change room</button></footer>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbxbk71KBnquE8aGmmWpjjGGeJSBdUzDE5xtOjYGc2PMQAFv_hVVVN9ymqUwWYTgYyid/exec';
const ROOM_KEY = 'carpool_room';
const POLL_MS = 3000;       // how often the TV asks for updates
const HIDDEN_POLL_MS = 15000; // only when the browser tab is hidden
const ROOM_RE = /^[A-Za-z0-9][A-Za-z0-9 \-]{0,11}$/;

const $ = id => document.getElementById(id);
const memory = {};

function getRoom() {
  try {
    const raw = localStorage.getItem(ROOM_KEY);
    return raw ? JSON.parse(raw).classroom || null : null;
  } catch (e) { return memory.room || null; }
}
function saveRoom(room) {
  memory.room = room;
  try { localStorage.setItem(ROOM_KEY, JSON.stringify({ classroom: room })); } catch (e) {}
}

/* A teacher can bookmark  carpool-tv.html?room=108  and skip setup. */
(function readRoomFromLink() {
  const wanted = new URLSearchParams(location.search).get('room');
  if (wanted && ROOM_RE.test(wanted.trim())) saveRoom(wanted.trim());
})();

let room = null;
let version = '';
let inflight = false;
let fails = 0;
let timer = null;
let firstPaint = true;

/* ---------- setup / display switching ---------- */
function showSetup() {
  $('display').hidden = true;
  $('setup').hidden = false;
  $('setupRoom').value = room || '';
  setTimeout(() => $('setupRoom').focus(), 0);
}
function showDisplay() {
  $('setup').hidden = true;
  $('display').hidden = false;
}
function submitRoom() {
  const value = $('setupRoom').value.trim().replace(/\s+/g, ' ');
  const err = $('setupErr');
  if (!ROOM_RE.test(value)) {
    err.textContent = 'Use letters, numbers, spaces or dashes, up to 12 characters.';
    err.hidden = false;
    return;
  }
  err.hidden = true;
  saveRoom(value);
  start();
}
$('setupSave').addEventListener('click', submitRoom);
$('setupRoom').addEventListener('keydown', e => { if (e.key === 'Enter') submitRoom(); });
$('changeRoom').addEventListener('click', () => { clearTimeout(timer); showSetup(); });

/* ---------- clock ---------- */
let lastClock = '';
function updateClock() {
  const text = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  if (text !== lastClock) { lastClock = text; $('clock').textContent = text; }
}
setInterval(updateClock, 1000);

/* ---------- connection light ---------- */
function setLive(ok) {
  $('live').classList.toggle('off', !ok);
  $('liveText').textContent = ok ? 'Live' : 'Reconnecting…';
}

/* ---------- drawing ---------- */
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function keyOf(f) { return f.t + '|' + f.family + '|' + f.child; }

// Re-use the cards already on screen. Only brand-new arrivals get
// created (and only they animate), so nothing flashes or jumps.
function reconcile(container, items, makeNode, updateNode) {
  const existing = new Map();
  Array.from(container.children).forEach(c => existing.set(c.dataset.k, c));
  const wanted = new Set();
  let previous = null;
  items.forEach(item => {
    const k = keyOf(item);
    wanted.add(k);
    let node = existing.get(k);
    if (!node) {
      node = makeNode(item);
      node.dataset.k = k;
      if (!firstPaint) {
        node.classList.add('enter');
        node.addEventListener('animationend', () => node.classList.remove('enter'), { once: true });
      }
    } else {
      updateNode(node, item);
    }
    const shouldBeNext = previous ? previous.nextElementSibling : container.firstElementChild;
    if (shouldBeNext !== node) container.insertBefore(node, shouldBeNext);
    previous = node;
  });
  existing.forEach((node, k) => { if (!wanted.has(k)) node.remove(); });
}

function makeCard(f) {
  const card = el('div', 'card');
  const who = el('div', 'who');
  who.append(el('div', 'name', f.child || f.family));
  if (f.child && f.family) who.append(el('div', 'family', f.family));
  card.append(who);
  if (f.notes) card.append(el('div', 'car', f.notes));
  return card;
}
function updateCard(card, f) {
  const car = card.querySelector('.car');
  if (f.notes) {
    if (car) { if (car.textContent !== f.notes) car.textContent = f.notes; }
    else card.append(el('div', 'car', f.notes));
  } else if (car) {
    car.remove();
  }
}
function makeChip(f) {
  const chip = el('div', 'chip');
  chip.append(el('span', 'tick', '✓'), el('span', null, f.child || f.family));
  return chip;
}

function applyFamilies(families) {
  const waiting = families.filter(f => f.status === 'InLine');
  const picked = families.filter(f => f.status === 'GotEm');
  reconcile($('cards'), waiting, makeCard, updateCard);
  reconcile($('chips'), picked, makeChip, () => {});
  $('emptyWaiting').hidden = waiting.length > 0;
  $('emptyPicked').hidden = picked.length > 0;
  firstPaint = false;
}

/* ---------- polling ---------- */
async function callApi(params, timeoutMs) {
  const url = new URL(API);
  Object.keys(params).forEach(k => url.searchParams.set(k, params[k]));
  const ctrl = new AbortController();
  const stop = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const res = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
    return await res.json();
  } finally {
    clearTimeout(stop);
  }
}

function nextDelay() {
  return document.hidden ? HIDDEN_POLL_MS : POLL_MS;
}

async function tick() {
  if (inflight || !room) return;
  inflight = true;
  const startedAt = Date.now();
  const thisRoom = room;
  try {
    const data = await callApi({ action: 'tvdata', classroom: thisRoom, v: version }, 9000);
    if (thisRoom !== room) return; // room changed while waiting
    if (!data.ok) throw new Error('bad response');
    fails = 0;
    setLive(true);
    if (!data.unchanged) {
      version = data.v || '';
      applyFamilies(data.families || []);
    }
  } catch (e) {
    fails++;
    if (fails >= 3) setLive(false);
  } finally {
    inflight = false;
    clearTimeout(timer);
    // Count the 3 seconds from when we asked, not from when the answer
    // came back, so a slow reply doesn't stretch the refresh time.
    timer = setTimeout(tick, Math.max(250, nextDelay() - (Date.now() - startedAt)));
  }
}

/* ---------- keep the screen awake ---------- */
let wakeLock = null;
async function keepAwake() {
  try {
    if ('wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) { wakeLock = null; }
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && room && !$('display').hidden) { keepAwake(); clearTimeout(timer); tick(); }
});

/* ---------- start ---------- */
function start() {
  room = getRoom();
  if (!room) { showSetup(); return; }
  version = '';
  fails = 0;
  firstPaint = true;
  $('cards').replaceChildren();
  $('chips').replaceChildren();
  $('emptyWaiting').hidden = false;
  $('emptyPicked').hidden = false;
  $('roomLabel').textContent = 'Room ' + room;
  setLive(true);
  showDisplay();
  updateClock();
  keepAwake();
  clearTimeout(timer);
  tick();
}
start();
</script>
</body>
</html>
