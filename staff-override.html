<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#D6F03C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CarRyde Staff">
<title>CarRyde Staff</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --vest: #D6F03C;
    --ink: #1C2128;
    --concrete: #EDEFEA;
    --white: #FFFFFF;
    --stripe: #C3CAA0;
    --line: #CDD2CA;
    --muted: #4F5861;
    --go: #17803D;
    --stop: #C62828;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --display: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
    --text: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; overscroll-behavior: none; background: var(--concrete); }
  body { margin: 0; font-family: var(--text); font-size: 17px; line-height: 1.35; color: var(--ink); background: var(--concrete); }
  button { font-family: inherit; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  [hidden] { display: none !important; }

  .app { max-width: 640px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; }
  header {
    position: relative;
    background: var(--vest);
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 20px 21px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  }
  header::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 9px;
    background: linear-gradient(to bottom, var(--stripe) 0 3px, transparent 3px 6px, var(--stripe) 6px 9px);
  }
  .brand { font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1; }
  .count { font-weight: 700; font-size: 17px; }

  main { padding: 18px 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
  .intro { margin: 0 0 16px; color: var(--muted); font-size: 16px; }
  .banner {
    margin: 0 0 14px; padding: 12px 14px; border-radius: 12px;
    background: #FBE4E4; color: #7C1D1D; font-weight: 600;
  }

  .sound {
    min-height: 40px; padding: 0 12px; border: 2px solid var(--ink); border-radius: 10px;
    background: transparent; color: var(--ink); font-weight: 700; font-size: 14px; cursor: pointer;
  }
  .sound[aria-pressed="true"] { background: var(--ink); color: var(--vest); }
  .sound:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .head-right { display: flex; align-items: center; gap: 12px; }

  /* ---------- Parents asking for a child to be called ---------- */
  .alerts { margin: 0 0 24px; }
  .alerts h2 {
    font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1;
    margin: 0 0 10px; display: flex; align-items: center; gap: 10px;
  }
  .badge {
    min-width: 32px; height: 32px; padding: 0 9px; border-radius: 999px;
    background: var(--stop); color: #fff; font-family: var(--text); font-weight: 700; font-size: 18px;
    display: inline-grid; place-items: center;
  }
  .alert-list { display: grid; gap: 10px; }
  .alert {
    display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center;
    background: var(--white); border: 2px solid var(--stop); border-left-width: 10px;
    border-radius: 14px; padding: 14px;
  }
  .alert.enter { animation: rise 240ms var(--ease-out) both; }
  .alert .name { font-size: 36px; }
  .alert .where { margin-top: 4px; font-weight: 700; font-size: 18px; }
  .alert .ask { margin-top: 2px; color: var(--stop); font-weight: 600; font-size: 15px; }
  .announce {
    min-height: 64px; padding: 0 18px; border: none; border-radius: 12px;
    background: var(--stop); color: #fff; font-weight: 700; font-size: 17px; cursor: pointer;
    transition: transform 120ms var(--ease-out);
  }
  .announce:active { transform: scale(0.96); }
  .announce:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .tag { margin-top: 4px; font-weight: 700; font-size: 14px; color: var(--stop); }
  .tag.done { color: var(--muted); }
  .list-title { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1; margin: 0 0 10px; }

  .list { display: grid; gap: 10px; }
  .row {
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px;
    background: var(--white); border: 2px solid var(--line); border-radius: 14px;
    padding: 12px 14px;
  }
  .row.enter { animation: rise 240ms var(--ease-out) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .room {
    min-width: 64px; text-align: center;
    background: var(--ink); color: var(--vest);
    font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1;
    padding: 8px 10px 9px; border-radius: 10px;
  }
  .room small { display: block; font-family: var(--text); font-weight: 600; font-size: 12px; opacity: 0.85; margin-bottom: 2px; }
  .info { min-width: 0; }
  .name { font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1; overflow-wrap: anywhere; }
  .sub { margin-top: 3px; color: var(--muted); font-size: 15px; font-weight: 500; overflow-wrap: anywhere; }
  .car { margin-top: 4px; font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
  .wait { font-weight: 600; font-size: 15px; color: var(--muted); }
  .wait.long { color: var(--stop); }
  .pick {
    min-height: 52px; padding: 0 16px;
    border: none; border-radius: 12px;
    background: var(--ink); color: var(--white);
    font-weight: 700; font-size: 16px; cursor: pointer;
    transition: transform 120ms var(--ease-out);
  }
  .pick:active { transform: scale(0.96); }
  .pick:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 18px; margin: 0; }
  .foot { margin: 18px 0 0; text-align: center; color: var(--muted); font-size: 14px; }

  @media (max-width: 380px) {
    .row { grid-template-columns: 1fr auto; }
    .room { grid-column: 1 / -1; justify-self: start; display: flex; gap: 6px; align-items: baseline; }
    .alert { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { .row.enter, .alert.enter { animation: none; } .pick, .announce { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">CarRyde Staff</div>
    <div class="head-right">
      <button class="sound" id="soundBtn" type="button" aria-pressed="false">Sound off</button>
      <div class="count" id="count" aria-live="polite"></div>
    </div>
  </header>
  <main>
    <section class="alerts" id="alerts" hidden aria-live="polite">
      <h2>Call to the car <span class="badge" id="alertCount">0</span></h2>
      <div class="alert-list" id="alertList"></div>
    </section>
    <h2 class="list-title" id="listTitle" hidden>Everyone in line</h2>
    <p class="intro">Everyone checked in right now, across every room. Tap "Picked up" only if a parent forgot to.</p>
    <div class="banner" id="banner" role="alert" hidden></div>
    <div class="list" id="list"></div>
    <p class="empty" id="empty" hidden>No one is checked in right now.</p>
    <p class="foot">Updates every few seconds.</p>
  </main>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbxbk71KBnquE8aGmmWpjjGGeJSBdUzDE5xtOjYGc2PMQAFv_hVVVN9ymqUwWYTgYyid/exec';
const POLL_MS = 4000;
const LONG_WAIT_MIN = 10;

const $ = id => document.getElementById(id);
let version = '';
let inflight = false;
let timer = null;
let fails = 0;
let firstPaint = true;
let latest = [];

async function callApi(params, timeoutMs) {
  const url = new URL(API);
  Object.keys(params).forEach(k => url.searchParams.set(k, params[k]));
  const ctrl = new AbortController();
  const stop = setTimeout(() => ctrl.abort(), timeoutMs || 10000);
  try {
    const res = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
    return await res.json();
  } finally {
    clearTimeout(stop);
  }
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function minutesSince(iso) {
  const t = new Date(iso).getTime();
  if (isNaN(t)) return 0;
  return Math.max(0, Math.floor((Date.now() - t) / 60000));
}
function waitText(iso) {
  const m = minutesSince(iso);
  return m < 1 ? 'Just arrived' : 'Waiting ' + m + ' min';
}
function keyOf(f) { return f.checkInTime + '|' + f.family; }

function showBanner(text) {
  $('banner').textContent = text || '';
  $('banner').hidden = !text;
}

function makeRow(f) {
  const row = el('div', 'row');

  const room = el('div', 'room');
  room.append(el('small', null, 'Room'), document.createTextNode(f.classroom));

  const info = el('div', 'info');
  info.append(el('div', 'name', f.child || f.family));
  const sub = el('div', 'sub');
  info.append(sub);
  const car = el('div', 'car');
  info.append(car);
  const tag = el('div', 'tag');
  info.append(tag);

  const right = el('div');
  const wait = el('div', 'wait');
  const btn = el('button', 'pick', 'Picked up');
  btn.type = 'button';
  btn.addEventListener('click', () => markPicked(row, f, btn));
  right.append(btn);

  row.append(room, info, right);
  row._parts = { sub: sub, car: car, wait: wait, room: room, tag: tag };
  // the wait time sits under the name so the button stays big
  info.insertBefore(wait, car);
  updateRow(row, f);
  return row;
}

function updateRow(row, f) {
  row._f = f;
  const p = row._parts;
  const sub = f.child && f.family ? f.family : '';
  if (p.sub.textContent !== sub) p.sub.textContent = sub;
  p.sub.hidden = !sub;
  if (p.car.textContent !== f.notes) p.car.textContent = f.notes;
  p.car.hidden = !f.notes;
  const tagText = f.call === 'requested' ? 'Parent asked for a call' : (f.call === 'announced' ? 'Announced' : '');
  if (p.tag.textContent !== tagText) p.tag.textContent = tagText;
  p.tag.className = 'tag' + (f.call === 'announced' ? ' done' : '');
  p.tag.hidden = !tagText;
  refreshWait(row);
}
function refreshWait(row) {
  const iso = row._f.checkInTime;
  const text = waitText(iso);
  if (row._parts.wait.textContent !== text) row._parts.wait.textContent = text;
  row._parts.wait.classList.toggle('long', minutesSince(iso) >= LONG_WAIT_MIN);
}

// Re-use the cards already on screen so nothing flashes. Only brand-new
// items are created, and only they animate.
function reconcile(container, items, keyFn, makeNode, updateNode) {
  const existing = new Map();
  Array.from(container.children).forEach(c => existing.set(c.dataset.k, c));
  const wanted = new Set();
  let previous = null;
  items.forEach(item => {
    const k = keyFn(item);
    wanted.add(k);
    let node = existing.get(k);
    if (!node) {
      node = makeNode(item);
      node.dataset.k = k;
      if (!firstPaint) {
        node.classList.add('enter');
        node.addEventListener('animationend', () => node.classList.remove('enter'), { once: true });
      }
    } else {
      updateNode(node, item);
    }
    const shouldBeNext = previous ? previous.nextElementSibling : container.firstElementChild;
    if (shouldBeNext !== node) container.insertBefore(node, shouldBeNext);
    previous = node;
  });
  existing.forEach((node, k) => { if (!wanted.has(k)) node.remove(); });
}

/* ---------- parents asking for a child to be called ---------- */
function alertKey(f) { return keyOf(f) + '|' + f.callAt; }

function makeAlert(f) {
  const card = el('div', 'alert');
  const info = el('div');
  const name = el('div', 'name', f.child || f.family);
  const where = el('div', 'where', 'Room ' + f.classroom);
  const car = el('div', 'sub');
  const ask = el('div', 'ask');
  info.append(name, where, car, ask);
  const btn = el('button', 'announce', 'Announced');
  btn.type = 'button';
  btn.addEventListener('click', () => callDone(card, f));
  card.append(info, btn);
  card._parts = { car: car, ask: ask };
  card._f = f;
  updateAlert(card, f);
  return card;
}
function updateAlert(card, f) {
  card._f = f;
  const lines = [];
  if (f.child && f.family) lines.push(f.family);
  if (f.notes) lines.push('Car: ' + f.notes);
  const text = lines.join('. ');
  if (card._parts.car.textContent !== text) card._parts.car.textContent = text;
  card._parts.car.hidden = !text;
  refreshAsk(card);
}
function refreshAsk(card) {
  const m = minutesSince(card._f.callAt);
  const text = m < 1 ? 'Asked just now' : 'Asked ' + m + ' min ago';
  if (card._parts.ask.textContent !== text) card._parts.ask.textContent = text;
}

/* ---------- sound ---------- */
const SOUND_KEY = 'carryde_staff_sound';
let soundOn = false;
let audioCtx = null;
try { soundOn = localStorage.getItem(SOUND_KEY) === '1'; } catch (e) {}

function paintSoundButton() {
  $('soundBtn').textContent = soundOn ? 'Sound on' : 'Sound off';
  $('soundBtn').setAttribute('aria-pressed', soundOn ? 'true' : 'false');
}
function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    [0, 0.28].forEach(offset => {
      const t0 = audioCtx.currentTime + offset;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.3, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.24);
    });
  } catch (e) {}
}
$('soundBtn').addEventListener('click', () => {
  soundOn = !soundOn;
  try { localStorage.setItem(SOUND_KEY, soundOn ? '1' : '0'); } catch (e) {}
  paintSoundButton();
  if (soundOn) beep(); // a tap is needed to unlock sound, and this proves it works
});
paintSoundButton();

let seenAlerts = new Set();

function draw(families) {
  latest = families.slice().sort((a, b) => new Date(a.checkInTime) - new Date(b.checkInTime));

  // Parents asking for a call, oldest request first
  const alerts = latest.filter(f => f.call === 'requested')
    .sort((a, b) => new Date(a.callAt) - new Date(b.callAt));
  reconcile($('alertList'), alerts, alertKey, makeAlert, updateAlert);
  $('alerts').hidden = alerts.length === 0;
  $('listTitle').hidden = alerts.length === 0 || latest.length === 0;
  $('alertCount').textContent = alerts.length;
  document.title = (alerts.length ? '(' + alerts.length + ') ' : '') + 'CarRyde Staff';
  const keys = new Set(alerts.map(alertKey));
  if (!firstPaint && alerts.some(f => !seenAlerts.has(alertKey(f))) && soundOn) {
    beep();
    try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
  }
  seenAlerts = keys;

  // Everyone in line
  reconcile($('list'), latest, keyOf, makeRow, updateRow);
  firstPaint = false;
  $('empty').hidden = latest.length > 0;
  $('count').textContent = latest.length ? latest.length + ' waiting' : '';
}

async function callDone(card, f) {
  card.remove();
  latest = latest.map(x => keyOf(x) === keyOf(f) ? Object.assign({}, x, { call: 'announced' }) : x);
  $('alerts').hidden = $('alertList').children.length === 0;
  $('alertCount').textContent = $('alertList').children.length;
  $('listTitle').hidden = $('alertList').children.length === 0;
  try {
    const res = await callApi({ action: 'callclear', family: f.family });
    if (!res.ok) throw new Error('rejected');
    showBanner('');
  } catch (e) {
    showBanner('Couldn’t save that ' + (f.child || f.family) + ' was announced. It may come back on the list.');
  }
  version = '';
  clearTimeout(timer);
  tick();
}

async function markPicked(row, f, btn) {
  btn.disabled = true;
  // remove it right away; if the server says no, we put it back
  row.remove();
  Array.from($('alertList').children).forEach(c => { if (c._f && keyOf(c._f) === keyOf(f)) c.remove(); });
  $('alerts').hidden = $('alertList').children.length === 0;
  $('alertCount').textContent = $('alertList').children.length;
  latest = latest.filter(x => keyOf(x) !== keyOf(f));
  $('empty').hidden = latest.length > 0;
  $('count').textContent = latest.length ? latest.length + ' waiting' : '';
  try {
    const res = await callApi({ action: 'gotem', family: f.family });
    if (!res.ok) throw new Error('rejected');
    showBanner('');
  } catch (e) {
    showBanner('Couldn’t mark ' + (f.child || f.family) + ' as picked up. Check your connection and try again.');
  }
  version = '';
  clearTimeout(timer);
  tick();
}

async function tick() {
  if (inflight) return;
  inflight = true;
  const startedAt = Date.now();
  try {
    const data = await callApi({ action: 'staffList', v: version }, 9000);
    if (!data.ok) throw new Error('bad response');
    if (fails >= 3) showBanner('');
    fails = 0;
    if (!data.unchanged) {
      version = data.v || '';
      draw(data.families || []);
    }
  } catch (e) {
    fails++;
    if (fails >= 3) showBanner('Can’t reach CarRyde. The list below may be out of date. Retrying…');
  } finally {
    inflight = false;
    clearTimeout(timer);
    timer = setTimeout(tick, Math.max(250, (document.hidden ? 15000 : POLL_MS) - (Date.now() - startedAt)));
  }
}

setInterval(() => {
  Array.from($('list').children).forEach(refreshWait);
  Array.from($('alertList').children).forEach(refreshAsk);
}, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { clearTimeout(timer); tick(); } });
tick();
</script>
</body>
</html>
