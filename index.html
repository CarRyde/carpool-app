<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#D6F03C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CarRyde">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>CarRyde</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --vest: #D6F03C;
    --ink: #1C2128;
    --concrete: #EDEFEA;
    --white: #FFFFFF;
    --stripe: #C3CAA0;
    --line: #CDD2CA;
    --muted: #4F5861;
    --go: #17803D;
    --stop: #C62828;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --display: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
    --text: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html {
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
    background: var(--concrete);
  }
  body {
    margin: 0;
    font-family: var(--text);
    font-size: 18px;
    line-height: 1.4;
    color: var(--ink);
    background: var(--concrete);
  }
  button, input { font-family: inherit; }
  button, a, [role="button"] {
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  /* ---------- Layout ---------- */
  .app {
    min-height: 100vh;
    min-height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background: var(--concrete);
  }
  header.top {
    background: var(--vest);
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 20px 12px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .info-btn {
    min-height: 44px;
    padding: 0 16px;
    border: 2px solid var(--ink);
    border-radius: 12px;
    background: transparent;
    color: var(--ink);
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    transition: transform 120ms var(--ease-out);
  }
  .info-btn:active { transform: scale(0.96); }
  .info-btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .info-btn[hidden] { display: none; }
  header.top .brand {
    font-family: var(--display);
    font-weight: 700;
    font-size: 28px;
    line-height: 1;
    letter-spacing: 0.01em;
  }
  /* two reflective stripes, like a crossing guard's vest */
  header.top::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 9px;
    background: linear-gradient(to bottom, var(--stripe) 0 3px, transparent 3px 6px, var(--stripe) 6px 9px);
  }
  header.top { padding-bottom: 21px; }

  main {
    flex: 1;
    padding: 24px 20px 20px;
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  .bar {
    position: sticky;
    bottom: 0;
    padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px));
    background: var(--concrete);
    border-top: 1px solid var(--line);
  }

  /* ---------- Type ---------- */
  .who {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(44px, 14vw, 68px);
    line-height: 0.95;
    margin: 0;
    overflow-wrap: anywhere;
  }
  .who.sm { font-size: clamp(36px, 11vw, 48px); }
  .room-tag {
    display: inline-block;
    margin-top: 12px;
    padding: 3px 12px 4px;
    border-radius: 8px;
    background: var(--ink);
    color: var(--vest);
    font-family: var(--display);
    font-weight: 700;
    font-size: 24px;
    line-height: 1.15;
  }
  h2.title {
    font-family: var(--display);
    font-weight: 700;
    font-size: 40px;
    line-height: 1;
    margin: 0 0 8px;
  }
  .lead { margin: 0 0 20px; color: var(--muted); }

  /* ---------- Form ---------- */
  .field { margin-bottom: 16px; }
  .field label, .group-label {
    display: block;
    font-weight: 600;
    font-size: 16px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .field input, .text-input {
    width: 100%;
    height: 56px;
    padding: 0 16px;
    border: 2px solid var(--line);
    border-radius: 12px;
    background: var(--white);
    color: var(--ink);
    font-size: 18px;
  }
  .field input:focus-visible, .text-input:focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 1px;
    border-color: var(--ink);
  }
  .form-error {
    margin: 0 0 14px;
    color: var(--stop);
    font-weight: 600;
  }

  /* ---------- Car details chips ---------- */
  .details { margin-top: 26px; }
  .group { margin-bottom: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    min-height: 46px;
    padding: 0 16px;
    border: 2px solid var(--line);
    border-radius: 999px;
    background: var(--white);
    color: var(--ink);
    font-size: 17px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: transform 120ms var(--ease-out), background-color 120ms var(--ease-out), border-color 120ms var(--ease-out);
  }
  .chip:active { transform: scale(0.96); }
  .chip[aria-pressed="true"] {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--white);
  }
  .chip:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .swatch {
    width: 16px; height: 16px;
    border-radius: 50%;
    border: 1.5px solid rgba(28,33,40,0.45);
    flex-shrink: 0;
  }
  .chip[aria-pressed="true"] .swatch { border-color: rgba(255,255,255,0.8); }

  /* ---------- Buttons ---------- */
  .cta {
    width: 100%;
    height: 76px;
    border: none;
    border-radius: 18px;
    font-family: var(--display);
    font-weight: 700;
    font-size: 34px;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: transform 120ms var(--ease-out);
  }
  .cta:active { transform: scale(0.97); }
  .cta:disabled { background: #D4D7CE; color: #7A828C; box-shadow: inset 0 0 0 3px #B9BEB2; cursor: not-allowed; transform: none; }
  [hidden] { display: none !important; }
  .cta:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .cta-go { background: var(--vest); color: var(--ink); box-shadow: inset 0 0 0 3px var(--ink); }
  .cta-dark { background: var(--ink); color: var(--white); }
  .btn-quiet {
    min-height: 48px;
    padding: 0 18px;
    border: 2px solid var(--ink);
    border-radius: 12px;
    background: transparent;
    color: var(--ink);
    font-weight: 700;
    font-size: 17px;
    cursor: pointer;
    transition: transform 120ms var(--ease-out);
  }
  .btn-quiet:active { transform: scale(0.97); }
  .link-btn {
    background: none;
    border: none;
    padding: 12px 4px;
    min-height: 44px;
    color: var(--muted);
    font-size: 16px;
    font-weight: 600;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
  }

  /* ---------- Checked-in status ---------- */
  .confirm {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 22px;
  }
  .confirm-mark {
    flex-shrink: 0;
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--go);
    display: grid;
    place-items: center;
    animation: pop 260ms var(--ease-out) both;
  }
  .confirm-mark svg { width: 30px; height: 30px; }
  @keyframes pop {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .confirm h2 {
    font-family: var(--display);
    font-weight: 700;
    font-size: 36px;
    line-height: 1;
    margin: 0;
  }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 18px 0 0;
    font-weight: 600;
    font-size: 17px;
    color: var(--muted);
    min-height: 28px;
  }
  .status.ok { color: var(--go); }
  .status.bad { color: var(--stop); }
  .status .dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .spin {
    width: 16px; height: 16px;
    border: 2.5px solid rgba(79,88,97,0.3);
    border-top-color: var(--muted);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status .retry { margin-left: auto; }

  /* ---------- "My child isn't with me" ---------- */
  .call { margin-top: 22px; }
  .btn-call {
    width: 100%;
    min-height: 60px;
    padding: 8px 16px;
    border: 2px solid var(--ink);
    border-radius: 14px;
    background: var(--white);
    color: var(--ink);
    font-weight: 700;
    font-size: 18px;
    line-height: 1.2;
    cursor: pointer;
    transition: transform 120ms var(--ease-out), background-color 120ms var(--ease-out), color 120ms var(--ease-out);
  }
  .btn-call:active { transform: scale(0.97); }
  .btn-call:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .btn-call.armed { background: var(--ink); color: var(--white); }
  .call-help { margin: 8px 0 0; color: var(--muted); font-size: 16px; }
  .call-state {
    padding: 12px 14px;
    background: var(--white);
    border-left: 6px solid var(--go);
    border-radius: 4px 12px 12px 4px;
    font-weight: 600;
  }
  .call-state.bad { border-left-color: var(--stop); color: var(--stop); }
  .call-state .spin { display: inline-block; vertical-align: -2px; margin-right: 8px; }

  .edit-note { margin-top: 26px; }
  .edit-row { display: flex; gap: 10px; }
  .edit-row .text-input { flex: 1; min-width: 0; }

  .car-line {
    margin: 16px 0 0;
    padding: 10px 14px;
    background: var(--white);
    border-left: 6px solid var(--vest);
    border-radius: 4px 12px 12px 4px;
    font-weight: 600;
    overflow-wrap: anywhere;
  }


  /* ---------- Setup: one block per child ---------- */
  .child-block {
    margin-bottom: 16px;
    padding: 14px 14px 2px;
    background: var(--white);
    border: 2px solid var(--line);
    border-radius: 16px;
  }
  .child-block .block-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: var(--display);
    font-weight: 700;
    font-size: 24px;
    margin-bottom: 8px;
  }
  .child-block .field input { background: var(--concrete); }
  .child-block .field input:disabled { opacity: 0.6; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .locked-note { margin: 0 0 12px; color: var(--muted); font-size: 16px; }

  /* ---------- Kid cards (in line / pickers) ---------- */
  .kid-card {
    margin-bottom: 16px;
    padding: 16px;
    background: var(--white);
    border: 2px solid var(--line);
    border-radius: 16px;
  }
  .kid-card .status { margin-top: 12px; }
  .kid-card .call { margin-top: 14px; }
  .kid-card.picked { background: transparent; border-style: dashed; }
  .kid-card.picked .line { display: flex; align-items: center; gap: 12px; }
  .kid-card.picked .mini-mark {
    width: 36px; height: 36px; border-radius: 50%; background: var(--go);
    display: grid; place-items: center; flex-shrink: 0;
  }
  .kid-card.picked .mini-mark svg { width: 20px; height: 20px; }
  .kid-card.picked .who { font-size: 30px; }
  .kid-card.picked .sub { color: var(--go); font-weight: 700; font-size: 16px; }
  .pick-name { display: inline-flex; align-items: center; gap: 12px; min-width: 0; text-align: left; }
  .box { width: 26px; height: 26px; flex: none; border-radius: 8px; border: 2.5px solid var(--ink); background: var(--white); display: inline-grid; place-items: center; }
  .chip[aria-pressed="true"] .box { background: var(--vest); border-color: var(--vest); }
  .box svg { width: 18px; height: 18px; }
  .box svg path { stroke: var(--ink); }
  .chip.wide { width: 100%; justify-content: space-between; min-height: 56px; margin-bottom: 8px; }
  .picklist { margin-bottom: 8px; }

  /* ---------- Yes / No ---------- */
  .yn { display: flex; gap: 12px; }
  .yn button {
    flex: 1;
    height: 68px;
    border: none;
    border-radius: 16px;
    font-family: var(--display);
    font-weight: 700;
    font-size: 32px;
    cursor: pointer;
    transition: transform 120ms var(--ease-out);
  }
  .yn button:active { transform: scale(0.97); }
  .yn button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .yn .yes { background: var(--vest); color: var(--ink); box-shadow: inset 0 0 0 3px var(--ink); }
  .yn .no { background: var(--ink); color: var(--white); }
  .yn.small button { height: 52px; font-size: 26px; border-radius: 12px; }
  .ask { margin: 0 0 12px; font-weight: 600; }
  .call-state.wait { border-left-color: var(--ink); }

  /* ---------- Slide to announce ---------- */
  .slider {
    position: relative;
    height: 76px;
    border-radius: 38px;
    background: var(--ink);
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .slider-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0;
    background: var(--go);
  }
  .slider-label {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding-left: 76px;
    padding-right: 14px;
    white-space: nowrap;
    color: var(--white);
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(15px, 4.4vw, 27px);
    letter-spacing: 0.01em;
    pointer-events: none;
  }
  .slider-thumb {
    position: absolute;
    left: 6px; top: 6px;
    width: 64px; height: 64px;
    border: none;
    border-radius: 50%;
    background: var(--vest);
    color: var(--ink);
    font-size: 34px;
    font-weight: 700;
    line-height: 1;
    display: grid;
    place-items: center;
    cursor: grab;
    touch-action: none;
    transition: transform 220ms var(--ease-out);
  }
  .slider-fill { transition: width 220ms var(--ease-out); }
  .slider.drag .slider-thumb, .slider.drag .slider-fill { transition: none; }
  .slider-thumb:focus-visible { outline: 3px solid var(--white); outline-offset: 2px; }
  .slider.done .slider-label { opacity: 0.85; }

  /* ---------- Home-screen hint ---------- */
  .hint {
    margin-top: 26px;
    padding: 16px;
    background: var(--white);
    border: 2px solid var(--line);
    border-radius: 14px;
  }
  .hint p { margin: 0 0 12px; }
  .hint strong { font-weight: 700; }
  .hint-actions { display: flex; gap: 10px; flex-wrap: wrap; }

  @media (hover: hover) and (pointer: fine) {
    .chip:hover { border-color: var(--ink); }
    .link-btn:hover { color: var(--ink); }
  }
  @media (prefers-reduced-motion: reduce) {
    .confirm-mark { animation: none; }
    .chip, .cta, .btn-quiet, .yn button, .info-btn { transition: none; }
    .slider-thumb, .slider-fill { transition: none; }
  }
  @media (max-width: 360px) {
    .cta { font-size: 30px; }
    .confirm h2 { font-size: 32px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="brand">CarRyde</div><button class="info-btn" id="infoBtn" type="button" hidden>My info</button></header>
  <main id="main"></main>
  <div class="bar" id="bar" hidden></div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbxbk71KBnquE8aGmmWpjjGGeJSBdUzDE5xtOjYGc2PMQAFv_hVVVN9ymqUwWYTgYyid/exec';

const PROFILE_KEY = 'carpool_profile';
const TRIP_KEY = 'carpool_trip_v3';
const HINT_KEY = 'carryde_hint_dismissed';
const TRIP_MAX_AGE = 3 * 60 * 60 * 1000; // an old trip never greets you tomorrow
const MAX_KIDS = 6;

const COLORS = [
  ['White', '#FFFFFF'], ['Black', '#1C2128'], ['Silver', '#BFC4CA'], ['Gray', '#7B828A'],
  ['Red', '#C62828'], ['Blue', '#2A5DB0'], ['Green', '#2E7D4F'], ['Tan', '#C9A66B']
];
const TYPES = ['SUV', 'Van', 'Truck', 'Sedan'];

/* ---------- storage (never throws, falls back to memory) ---------- */
const memory = {};
function readJSON(key) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    try { return memory[key] ? JSON.parse(memory[key]) : null; } catch (e2) { return null; }
  }
}
function writeJSON(key, value) {
  const raw = JSON.stringify(value);
  memory[key] = raw;
  try { localStorage.setItem(key, raw); } catch (e) {}
}
function removeKey(key) {
  delete memory[key];
  try { localStorage.removeItem(key); } catch (e) {}
}

/* ---------- people ---------- */
function uid() {
  return 'k' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
}
function squish(s) { return String(s == null ? '' : s).trim().replace(/\s+/g, ' '); }
function fullName(c) { return squish((c.first || '') + ' ' + (c.last || '')); }

// Older versions saved { family, child, classroom }. Turn that into the
// new shape: one entry per child, with first and last name apart.
function normalizeProfile(p) {
  if (!p || typeof p !== 'object') return { profile: null, changed: false };
  if (Array.isArray(p.children)) {
    let changed = false;
    p.children.forEach(c => { if (!c.id) { c.id = uid(); changed = true; } });
    return { profile: p, changed: changed };
  }
  if (p.family || p.child || p.classroom) {
    const parts = squish(p.child).split(' ').filter(Boolean);
    const first = parts.shift() || '';
    const last = parts.join(' ');
    return {
      profile: { family: squish(p.family), children: [{ id: uid(), first: first, last: last, room: squish(p.classroom) }] },
      changed: true
    };
  }
  return { profile: null, changed: false };
}

/* ---------- state ---------- */
removeKey('carpool_trip_v2'); // the old one-child trip can't be used any more
let profile = (function () {
  const r = normalizeProfile(readJSON(PROFILE_KEY));
  if (r.profile && r.changed) writeJSON(PROFILE_KEY, r.profile);
  return r.profile;
})();
let trip = loadTrip();           // { started, ts, notes, car, kids: { id: { status, sent, call, ... } } }
let draft = (trip.started && trip.car) ? Object.assign({ color: '', type: '', text: '' }, trip.car) : { color: '', type: '', text: '' };
let flow = '';                   // '', 'grounds', 'notyet', 'slide' (only while checking in)
let callStep = null;             // { id, step } while a parent is going through the intercom questions
let selected = null;             // Set of child ids being picked up
let flushing = false;
let retryTimer = null;
let retryCount = 0;
let installPrompt = null;
const knet = {};                 // per-child network state: sending | sent | retrying

// Every time the page opens it starts on the "I'm here" screen.
function loadTrip() {
  removeKey(TRIP_KEY);
  return {};
}
function saveTrip() { writeJSON(TRIP_KEY, trip); }
function childById(id) { return profile && profile.children.find(c => c.id === id); }
function selIds() {
  const all = profile.children.map(c => c.id);
  if (!selected) selected = new Set(all);
  selected.forEach(id => { if (all.indexOf(id) < 0) selected.delete(id); });
  if (selected.size === 0) all.forEach(id => selected.add(id));
  return all.filter(id => selected.has(id));
}
function tripIds() { return trip.started ? Object.keys(trip.kids).filter(id => childById(id)) : []; }

/* ---------- tiny DOM helper (text only, never raw HTML) ---------- */
function h(tag, attrs, ...kids) {
  const node = document.createElement(tag);
  for (const k in (attrs || {})) {
    const v = attrs[k];
    if (v === false || v == null) continue;
    if (k === 'class') node.className = v;
    else if (k === 'text') node.textContent = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? '' : v);
  }
  kids.flat().forEach(kid => {
    if (kid == null || kid === false) return;
    node.append(kid.nodeType ? kid : document.createTextNode(kid));
  });
  return node;
}
function svgCheck() {
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('aria-hidden', 'true');
  const p = document.createElementNS(ns, 'path');
  p.setAttribute('d', 'M5 12.5l4.5 4.5L19 7.5');
  p.setAttribute('fill', 'none');
  p.setAttribute('stroke', '#fff');
  p.setAttribute('stroke-width', '3.2');
  p.setAttribute('stroke-linecap', 'round');
  p.setAttribute('stroke-linejoin', 'round');
  svg.append(p);
  return svg;
}

/* ---------- network ---------- */
async function callApi(action, params, timeoutMs) {
  const url = new URL(API);
  url.searchParams.set('action', action);
  Object.keys(params || {}).forEach(k => url.searchParams.set(k, params[k]));
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs || 15000);
  try {
    const res = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
    const out = await res.json();
    retryCount = 0;
    return out;
  } finally {
    clearTimeout(timer);
  }
}

// Sends whatever hasn't reached the server yet, one child at a time.
// The screen changes the instant a button is tapped; this runs behind
// it and keeps retrying if the signal drops (common at a pickup line).
async function flush() {
  if (flushing) return;
  flushing = true;
  clearTimeout(retryTimer);
  try {
    let progress = true;
    while (progress && trip.started) {
      progress = false;
      for (const id of Object.keys(trip.kids)) {
        const k = trip.kids[id];
        const c = childById(id);
        if (!k || !c) continue;
        const name = fullName(c);

        if ((k.status === 'inline' || k.status === 'picked') && !k.sent) {
          setNet(id, 'sending');
          const res = await callApi('checkin', {
            family: c.last, id: id, classroom: c.room, child: name, notes: trip.notes || ''
          });
          if (res.busy) throw new Error('busy');   // server is full for a moment: try again
          if (!res.ok) { rejected(); return; }
          k.sent = true;
          saveTrip();
          setNet(id, 'sent');
          progress = true;
          continue;
        }
        if (k.status === 'inline' && k.call === 'pending') {
          // Staff hear about it only after the check-in has gone through.
          const res = await callApi('callchild', { family: c.last, id: id, child: name });
          if (res.busy) throw new Error('busy');
          if (res.ok) {
            k.call = 'sent';
          } else if (!k.recheck) {
            k.recheck = true;   // maybe the row is gone; check in again, then retry once
            k.sent = false;
          } else {
            k.call = 'failed';
          }
          saveTrip();
          paintCall(id);
          progress = true;
          continue;
        }
        if (k.status === 'picked' && !k.pickedSent) {
          const gres = await callApi('gotem', { family: c.last, id: id, child: name });
          if (!gres || !gres.ok) throw new Error('gotem not saved');
          k.pickedSent = true;
          saveTrip();
          progress = true;
        }
      }
    }
  } catch (e) {
    Object.keys(trip.kids || {}).forEach(id => { if (!trip.kids[id].sent) setNet(id, 'retrying'); });
    // Wait a little longer each time, with a random bit so a crowd of
    // phones doesn't all retry in the same second.
    retryCount = Math.min(retryCount + 1, 5);
    retryTimer = setTimeout(flush, Math.min(8000, 1500 * retryCount) + Math.random() * 2000);
  } finally {
    flushing = false;
  }
}

function rejected() {
  // The server understood but refused (for example, a missing room).
  trip = {};
  saveTrip();
  flow = '';
  render(true);
}

function setNet(id, state) {
  knet[id] = state;
  paintStatus(id);
}

function paintStatus(id) {
  const el = document.querySelector('[data-kid="' + id + '"]');
  const c = childById(id);
  const k = trip.kids && trip.kids[id];
  if (!el || !c || !k) return;
  el.replaceChildren();
  el.className = 'status';
  const room = 'Room ' + c.room;
  let state = knet[id];
  if (!state || state === 'idle') state = k.sent ? 'sent' : 'sending';
  if (state === 'sending') {
    el.append(h('span', { class: 'spin' }), 'Sending to ' + room + '…');
  } else if (state === 'sent') {
    el.classList.add('ok');
    el.append(h('span', { class: 'dot' }), room + ' can see you now.');
  } else if (state === 'retrying') {
    el.classList.add('bad');
    el.append(h('span', { class: 'dot' }), 'No signal. Trying again…',
      h('button', { class: 'btn-quiet retry', type: 'button', onclick: () => flush() }, 'Try now'));
  }
}

/* ---------- "my child isn't with me yet" (intercom) ----------
   Staff hear nothing until the slider is slid all the way. */
function askAnnounce(id) {
  const prev = callStep && callStep.id;
  callStep = { id: id, step: 'slide' };
  if (prev && prev !== id) paintCall(prev);
  paintCall(id);
}
function setStep(id, step) { callStep = step ? { id: id, step: step } : null; paintCall(id); }

function confirmAnnounce(id) {
  const k = trip.kids[id];
  if (!k || k.call === 'pending') return;      // a second slide can't send twice
  callStep = null;
  k.call = 'pending';
  k.recheck = false;
  saveTrip();
  paintCall(id);
  flush();
}

function paintCall(id) {
  const box = document.querySelector('[data-call="' + id + '"]');
  const c = childById(id);
  const k = trip.kids && trip.kids[id];
  if (!box || !c || !k) return;
  const name = fullName(c);
  const step = callStep && callStep.id === id ? callStep.step : '';
  box.replaceChildren();
  if (k.call === 'pending') {
    box.append(h('div', { class: 'call-state' }, h('span', { class: 'spin' }), 'Telling staff…'));
  } else if (step === 'slide') {
    box.append(
      h('p', { class: 'ask', text: 'Slide to tell staff. Only do this while parked.' }),
      makeSlider('Slide to Announce Pickup', () => confirmAnnounce(id)),
      h('button', { class: 'link-btn', type: 'button', onclick: () => setStep(id, '') }, 'Cancel'));
  } else if (k.call === 'sent') {
    box.append(
      h('div', { class: 'call-state' }, 'Staff has been told. They’ll call ' + name + ' on the intercom.'),
      h('button', { class: 'link-btn', type: 'button', onclick: () => askAnnounce(id) }, 'Announce again'));
  } else {
    if (k.call === 'failed') {
      box.append(h('p', { class: 'call-state bad', role: 'alert' }, 'We couldn’t reach staff. Try again.'));
    }
    box.append(
      h('button', { class: 'btn-call', type: 'button', onclick: () => askAnnounce(id) }, 'My child isn’t with me yet'),
      h('p', { class: 'call-help', text: 'Staff will call ' + name + ' on the intercom.' }));
  }
}

/* ---------- slide to announce ---------- */
function makeSlider(label, onDone) {
  let done = false, dragging = false, startX = 0, pos = 0, max = 1;
  const thumb = h('button', {
    class: 'slider-thumb', type: 'button', role: 'slider', 'aria-label': label + ' (use the right arrow key)',
    'aria-valuemin': 0, 'aria-valuemax': 100, 'aria-valuenow': 0
  }, '→');
  const fill = h('div', { class: 'slider-fill' });
  const track = h('div', { class: 'slider' }, fill, h('div', { class: 'slider-label', text: label }), thumb);

  function measure() { max = Math.max(1, track.clientWidth - thumb.offsetWidth - 12); }
  function set(p) {
    pos = Math.max(0, Math.min(max, p));
    thumb.style.transform = 'translateX(' + pos + 'px)';
    fill.style.width = (pos > 0 ? pos + 70 : 0) + 'px';
    thumb.setAttribute('aria-valuenow', String(Math.round(pos / max * 100)));
  }
  function finish() {
    if (done) return;       // lock: one announcement per slide
    done = true;
    dragging = false;
    track.classList.remove('drag');
    track.classList.add('done');
    set(max);
    thumb.setAttribute('aria-valuenow', '100');
    try { navigator.vibrate && navigator.vibrate(30); } catch (e) {}
    setTimeout(onDone, 160);
  }
  function release() {
    if (!dragging || done) return;
    dragging = false;
    track.classList.remove('drag');
    if (pos >= max * 0.95) finish(); else set(0);
  }
  thumb.addEventListener('pointerdown', e => {
    if (done || (e.pointerType === 'mouse' && e.button !== 0)) return;
    measure();
    dragging = true;
    startX = e.clientX - pos;
    track.classList.add('drag');
    try { thumb.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });
  thumb.addEventListener('pointermove', e => {
    if (!dragging || done) return;
    set(e.clientX - startX);
  });
  thumb.addEventListener('pointerup', release);
  thumb.addEventListener('pointercancel', release);
  thumb.addEventListener('lostpointercapture', release);
  thumb.addEventListener('keydown', e => {
    if (done) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
      e.preventDefault(); measure(); set(pos + max * 0.25);
      if (pos >= max * 0.95) finish();
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
      e.preventDefault(); measure(); set(pos - max * 0.25);
    } else if (e.key === 'Home') {
      e.preventDefault(); set(0);
    } else if (e.key === 'End') {
      e.preventDefault(); measure(); set(max); finish();
    } else if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();   // a plain press must not announce anything
    }
  });
  return track;
}

/* ---------- screens ---------- */
const main = document.getElementById('main');
const bar = document.getElementById('bar');
const infoBtn = document.getElementById('infoBtn');
let editingNow = false;
infoBtn.addEventListener('click', () => { if (editingNow) render(); else renderSetup(true); });

// replaceChildren would print the word "null" for empty slots, so drop them.
function fillMain(...nodes) {
  main.replaceChildren(...nodes.flat().filter(Boolean));
  main.scrollTop = 0;
}

function showBar(node) {
  bar.replaceChildren();
  if (!node) { bar.hidden = true; return; }
  bar.append(node);
  bar.hidden = false;
}

function render(showRejected) {
  editingNow = false;
  infoBtn.textContent = 'My info';
  infoBtn.hidden = !profile;
  if (!profile) return renderSetup(false);
  if (trip.started && tripIds().length) {
    flow = '';
    return tripIds().some(id => trip.kids[id].status === 'inline') ? renderInLine() : renderDone();
  }
  return renderIdle(showRejected ? 'We couldn’t check you in. Check your child’s name and room in My info, then try again.' : '');
}

function nameBlock(c, small) { return h('p', { class: 'who' + (small ? ' sm' : ''), text: fullName(c) }); }
function roomTag(c) { return h('span', { class: 'room-tag', text: 'Room ' + c.room }); }

/* --- My info / first-time setup --- */
function renderSetup(editing, startError) {
  editingNow = !!editing;
  infoBtn.textContent = 'Back';
  infoBtn.hidden = !editing;
  flow = '';
  const wc = editing
    ? { family: profile.family, children: profile.children.map(c => Object.assign({}, c)) }
    : { family: '', children: [{ id: uid(), first: '', last: '', room: '' }] };
  const locked = new Set(tripIds());      // names can't change while a child is in line
  let error = startError || '';
  let focusId = null;
  let refreshSave = null;

  // Every box for every child must be filled in before Save works.
  function isComplete() {
    const kids = wc.children.map(c => ({ first: squish(c.first), last: squish(c.last), room: squish(c.room) }));
    return kids.length > 0 && kids.every(c => c.first && c.last && c.room);
  }

  function field(label, id, value, attrs, onInput, disabled) {
    const input = h('input', Object.assign({ id: id, value: value, autocomplete: 'off', disabled: disabled }, attrs));
    input.addEventListener('input', () => { onInput(input.value); if (refreshSave) refreshSave(); });
    return h('div', { class: 'field' }, h('label', { for: id, text: label }), input);
  }

  function save() {
    const kids = wc.children.map(c => ({ id: c.id, first: squish(c.first), last: squish(c.last), room: squish(c.room) }));
    let msg = '';
    for (let i = 0; !msg && i < kids.length; i++) {
      const who = kids.length > 1 ? 'child ' + (i + 1) + '’s' : 'your child’s';
      if (!kids[i].first) msg = 'Enter ' + who + ' first name.';
      else if (!kids[i].last) msg = 'Enter ' + who + ' last name. Staff say the full name on the intercom.';
      else if (!kids[i].room) msg = 'Enter ' + who + ' classroom number.';
    }
    if (!msg) {
      const names = kids.map(c => fullName(c).toLowerCase());
      if (new Set(names).size !== names.length) msg = 'Each child needs a different name.';
    }
    if (msg) { error = msg; draw(); return; }
    if (!isComplete()) return;

    let needFlush = false;
    if (editing) {
      const note = currentNote();
      if (trip.started && note !== (trip.notes || '')) {
        trip.notes = note;
        trip.car = Object.assign({}, draft);
        tripIds().forEach(id => {
          const k = trip.kids[id];
          if (k.status === 'inline') { k.sent = false; delete knet[id]; }
        });
        needFlush = true;
      }
    }
    kids.forEach(c => {
      const k = trip.started && trip.kids[c.id];
      const before = childById(c.id);
      if (k && before && before.room !== c.room) {   // fixed a wrong room: tell the TV again
        if (k.status === 'inline') { k.sent = false; delete knet[c.id]; needFlush = true; }
      }
    });
    profile = { family: kids[0].last, children: kids };
    writeJSON(PROFILE_KEY, profile);
    selected = null;
    if (trip.started) saveTrip();
    render();
    if (needFlush) flush();
  }

  function draw() {
    chipHost = h('div');
    const blocks = wc.children.map((c, i) => {
      const isLocked = locked.has(c.id);
      return h('div', { class: 'child-block' },
        h('div', { class: 'block-title' },
          h('span', { text: wc.children.length > 1 ? 'Child ' + (i + 1) : 'Your child' }),
          (wc.children.length > 1 && !isLocked)
            ? h('button', { class: 'link-btn', type: 'button', onclick: () => { wc.children.splice(i, 1); error = ''; draw(); } }, 'Remove')
            : null),
        h('div', { class: 'row2' },
          field('First name', 'f_first_' + c.id, c.first, { placeholder: 'Jordan', autocapitalize: 'words', enterkeyhint: 'next', maxlength: 30 }, v => { c.first = v; }, isLocked),
          field('Last name', 'f_last_' + c.id, c.last, { placeholder: 'Smith', autocapitalize: 'words', enterkeyhint: 'next', maxlength: 30 }, v => { c.last = v; }, isLocked)),
        field('Classroom number', 'f_room_' + c.id, c.room, { placeholder: '108', autocapitalize: 'characters', enterkeyhint: 'done', maxlength: 12 }, v => { c.room = v; }, false),
        isLocked ? h('p', { class: 'locked-note', text: 'Name is locked while this child is in line. You can still fix the room.' }) : null);
    });

    const addBtn = wc.children.length < MAX_KIDS
      ? h('button', { class: 'btn-quiet', type: 'button', style: 'width:100%;margin-bottom:16px', onclick: () => {
          if (!isComplete()) { error = 'Finish the boxes above before adding another child.'; draw(); return; }
          const nc = { id: uid(), first: '', last: '', room: '' };
          wc.children.push(nc);
          focusId = 'f_first_' + nc.id;
          error = '';
          draw();
        } }, '+ Add another child')
      : null;

    fillMain(
      h('h2', { class: 'title', text: editing ? 'My info' : 'Set up once' }),
      h('p', { class: 'lead', text: editing
        ? 'Fix anything that’s wrong, then tap Save. Tap Back to leave without changing anything.'
        : 'This stays on this phone, so next time it’s one tap. Add each child, even if they’re in different classrooms.' }),
      blocks,
      addBtn,
      editing ? h('div', { class: 'details' },
        h('p', { class: 'lead', style: 'margin-bottom:12px', text: 'Car details (optional). Helps your child spot your car.' }),
        chipHost,
        h('div', { class: 'field', style: 'margin-top:4px' }, carInput('extra'))) : null,
      error ? h('p', { class: 'form-error', role: 'alert', text: error }) : null,
      h('p', { class: 'call-help', id: 'fillHint', style: 'margin-top:0', text: 'Fill in every box to continue.' })
    );
    if (editing) renderChips();
    const saveBtn = h('button', { class: 'cta cta-go', type: 'button', onclick: save }, editing ? 'Save changes' : 'Save');
    refreshSave = () => {
      const ok = isComplete();
      saveBtn.disabled = !ok;
      const hint = document.getElementById('fillHint');
      if (hint) hint.hidden = ok;
    };
    refreshSave();
    showBar(saveBtn);
    if (focusId) { const el = document.getElementById(focusId); if (el) el.focus(); focusId = null; }
  }
  draw();
}

/* --- car details (optional; also editable after checking in) --- */
function currentNote() {
  const vehicle = [draft.color, draft.type].filter(Boolean).join(' ');
  return [vehicle, draft.text.trim()].filter(Boolean).join(', ');
}

function chip(label, selected, onTap, swatchColor) {
  const b = h('button', { class: 'chip', type: 'button', 'aria-pressed': selected ? 'true' : 'false' },
    swatchColor ? h('span', { class: 'swatch', style: 'background:' + swatchColor }) : null, label);
  b.addEventListener('click', () => {
    onTap();
    renderChips();
  });
  return b;
}

let chipHost = null;
function renderChips() {
  if (!chipHost) return;
  chipHost.replaceChildren(
    h('div', { class: 'group' },
      h('span', { class: 'group-label', text: 'Car color' }),
      h('div', { class: 'chips' }, COLORS.map(c =>
        chip(c[0], draft.color === c[0], () => { draft.color = draft.color === c[0] ? '' : c[0]; }, c[1])))),
    h('div', { class: 'group' },
      h('span', { class: 'group-label', text: 'Kind of car' }),
      h('div', { class: 'chips' }, TYPES.map(t =>
        chip(t, draft.type === t, () => { draft.type = draft.type === t ? '' : t; }))))
  );
}

function carInput(id) {
  const input = h('input', {
    class: 'text-input', id: id, value: draft.text, maxlength: 60,
    placeholder: 'Make and model, like Honda Odyssey',
    autocomplete: 'off', autocapitalize: 'sentences', enterkeyhint: 'done'
  });
  input.addEventListener('input', () => { draft.text = input.value; });
  return input;
}

/* --- before checking in --- */
function renderIdle(errorText) {
  const kids = profile.children;
  selIds();

  const missingLast = kids.filter(c => !c.last);
  const notice = missingLast.length
    ? h('div', { class: 'hint', style: 'margin-bottom:16px' },
        h('p', null, h('strong', { text: 'Add your child’s last name. ' }), 'Staff need the full name to call them on the intercom.'),
        h('div', { class: 'hint-actions' },
          h('button', { class: 'btn-quiet', type: 'button', onclick: () => renderSetup(true) }, 'Add last name')))
    : null;

  let people;
  if (kids.length === 1) {
    people = [nameBlock(kids[0]), roomTag(kids[0])];
  } else {
    const pickHost = h('div', { class: 'picklist' });
    const drawPick = () => {
      const cur = selIds();
      pickHost.replaceChildren(...kids.map(c => {
        const on = cur.indexOf(c.id) >= 0;
        const b = h('button', { class: 'chip wide', type: 'button', role: 'checkbox', 'aria-checked': on ? 'true' : 'false', 'aria-pressed': on ? 'true' : 'false' },
          h('span', { class: 'pick-name' }, h('span', { class: 'box' }, on ? svgCheck() : null), h('span', { text: fullName(c) })),
          h('span', { text: 'Room ' + c.room }));
        b.addEventListener('click', () => {
          if (on && cur.length === 1) return;     // at least one child stays selected
          if (on) selected.delete(c.id); else selected.add(c.id);
          drawPick();
        });
        return b;
      }));
    };
    drawPick();
    people = [
      h('span', { class: 'group-label', text: 'Who are you picking up? Tap to choose one or more.' }),
      pickHost,
      h('p', { class: 'call-help', style: 'margin-top:0', text: 'Each child shows on their own classroom’s TV.' })
    ];
  }

  fillMain(
    errorText ? h('p', { class: 'form-error', role: 'alert', text: errorText }) : null,
    notice,
    people,
    hintCard()
  );

  if (flow === 'grounds') {
    showBar(h('div', null,
      h('p', { class: 'ask', text: 'Are you currently on school grounds?' }),
      h('div', { class: 'yn' },
        h('button', { class: 'yes', type: 'button', onclick: () => arrive() }, 'YES'),
        h('button', { class: 'no', type: 'button', onclick: () => { flow = 'notyet'; renderIdle(); } }, 'NO'))));
  } else if (flow === 'notyet') {
    showBar(h('div', null,
      h('p', { class: 'call-state wait', role: 'status', text: 'Please wait until you arrive on school grounds before checking in.' }),
      h('button', { class: 'cta cta-dark', type: 'button', onclick: () => { flow = ''; renderIdle(); } }, 'OK')));
  } else {
    showBar(h('button', { class: 'cta cta-go', id: 'hereBtn', type: 'button', onclick: startArrive }, 'I’m here'));
  }
}

function startArrive() {
  const ids = selIds();
  if (!ids.length) return;
  if (profile.children.some(c => ids.indexOf(c.id) >= 0 && (!c.first || !c.last || !c.room))) {
    renderSetup(true, 'Fill in your child’s first name, last name and classroom first, so staff know exactly who to call.');
    return;
  }
  flow = 'grounds';
  renderIdle();
}

function arrive() {
  if (trip.started && tripIds().length) return;   // already checked in: never announce twice
  flow = '';
  const ids = selIds();
  const kids = {};
  ids.forEach(id => { kids[id] = { status: 'inline', sent: false, call: '' }; });
  trip = { started: true, ts: Date.now(), notes: currentNote(), car: Object.assign({}, draft), kids: kids };
  saveTrip();
  try { navigator.vibrate && navigator.vibrate(25); } catch (e) {}
  render();
  flush();
}

/* --- in line --- */
function kidCard(id, multi) {
  const c = childById(id);
  const k = trip.kids[id];
  if (k.status === 'picked') {
    return h('div', { class: 'kid-card picked' },
      h('div', { class: 'line' },
        h('div', { class: 'mini-mark' }, svgCheck()),
        h('div', null, h('p', { class: 'who', text: fullName(c) }), h('div', { class: 'sub', text: 'Picked up' }))));
  }
  return h('div', { class: 'kid-card' },
    nameBlock(c, multi),
    roomTag(c),
    h('div', { class: 'status', role: 'status', 'aria-live': 'polite', 'data-kid': id }),
    h('div', { class: 'call', 'data-call': id }),
    multi ? h('button', { class: 'btn-quiet', type: 'button', style: 'margin-top:14px;width:100%', onclick: () => pickedUp([id]) }, 'Got ’em') : null);
}

function renderInLine() {
  const ids = tripIds();
  const multi = ids.length > 1;
  const remaining = ids.filter(id => trip.kids[id].status === 'inline');
  fillMain(
    h('div', { class: 'confirm' },
      h('div', { class: 'confirm-mark' }, svgCheck()),
      h('h2', { text: 'You’re in line' })),
    ids.map(id => kidCard(id, multi)),
    trip.notes ? h('p', { class: 'car-line', text: 'Car: ' + trip.notes }) : null,
    hintCard()
  );
  ids.forEach(id => { paintStatus(id); paintCall(id); });
  showBar(h('button', { class: 'cta cta-dark', type: 'button', onclick: () => pickedUp(remaining) },
    remaining.length > 1 ? 'Got ’em all' : 'Got ’em'));
}

function pickedUp(list) {
  list.forEach(id => {
    const k = trip.kids[id];
    if (k && k.status === 'inline') { k.status = 'picked'; k.pickedSent = false; }
  });
  callStep = null;
  trip.ts = Date.now();
  saveTrip();
  render();
  flush();
}

function renderDone() {
  const ids = tripIds();
  fillMain(
    h('div', { class: 'confirm' },
      h('div', { class: 'confirm-mark' }, svgCheck()),
      h('h2', { text: 'Pickup done' })),
    ids.map(id => h('p', { class: 'who' + (ids.length > 1 ? ' sm' : ''), style: 'margin-bottom:6px', text: fullName(childById(id)) })),
    h('p', { class: 'lead', style: 'margin-top:14px', text: 'See you tomorrow.' }),
    hintCard()
  );
  showBar(h('button', { class: 'cta cta-go', type: 'button', onclick: () => {
    trip = {};
    saveTrip();
    draft = { color: '', type: '', text: '' };
    selected = null;
    flow = '';
    render();
  } }, 'Back to start'));
}

/* ---------- add to home screen ---------- */
function isStandalone() {
  return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
}
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  installPrompt = e;
  if (profile && !flow && document.getElementById('hereBtn')) render();
});
window.addEventListener('appinstalled', () => { writeJSON(HINT_KEY, 1); installPrompt = null; if (profile) render(); });

function hintCard() {
  if (isStandalone() || readJSON(HINT_KEY)) return null;
  const ua = navigator.userAgent || '';
  const isIos = /iPhone|iPad|iPod/.test(ua);
  const isAndroid = /Android/.test(ua);
  if (!isIos && !isAndroid) return null;

  const actions = h('div', { class: 'hint-actions' });
  let message;
  if (installPrompt) {
    message = [h('strong', { text: 'Skip the link next time. ' }), 'Put CarRyde on your home screen.'];
    actions.append(h('button', { class: 'btn-quiet', type: 'button', onclick: async () => {
      try { installPrompt.prompt(); await installPrompt.userChoice; } catch (e) {}
      installPrompt = null;
      render();
    } }, 'Add to home screen'));
  } else if (isIos) {
    message = [h('strong', { text: 'Skip the link next time. ' }), 'Tap the Share button, then “Add to Home Screen.”'];
  } else {
    message = [h('strong', { text: 'Skip the link next time. ' }), 'Tap the ⋮ menu, then “Add to Home screen.”'];
  }
  actions.append(h('button', { class: 'link-btn', type: 'button', onclick: () => { writeJSON(HINT_KEY, 1); render(); } }, 'Hide this'));
  return h('div', { class: 'hint', style: 'margin-top:26px' }, h('p', null, message), actions);
}

/* ---------- start ---------- */
render();
if (trip.started) flush();
window.addEventListener('online', () => { if (trip.started) flush(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && trip.started) flush(); });
</script>
